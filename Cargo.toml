[package]
name = "grit"
version = "0.12.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
flate2 = "1.0"
sha1 = "0.10"
hex = "0.4"
lru = "0.12"
glob = "0.3"

[dev-dependencies]
tempfile = "3.0"
proptest = "1.0"
criterion = "0.5"
assert_cmd = "2.0"

[[bench]]
name = "object_operations"
harness = false

[[bench]]
name = "tree_operations"
harness = false

[[bench]]
name = "comparison"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

