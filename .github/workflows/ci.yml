name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-build:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run cargo fmt
        run: cargo fmt --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run cargo build
        run: cargo build
      - name: Run cargo test
        run: cargo test
      - name: Run cargo test with custom build dir
        run: CARGO_BUILD_BUILD_DIR=build cargo test
      - name: Run cargo doc
        run: cargo doc --no-deps
